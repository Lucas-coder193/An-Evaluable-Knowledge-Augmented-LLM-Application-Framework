<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grounded Retrieval Agent</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #172033; }
    main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; }
    .muted { color: #657089; }
    .card { background: white; border: 1px solid #dfe5ef; border-radius: 12px; padding: 20px; margin-top: 18px; box-shadow: 0 4px 16px #1720330d; }
    textarea { width: 100%; min-height: 100px; resize: vertical; box-sizing: border-box; padding: 12px; border: 1px solid #c8d1df; border-radius: 8px; font: inherit; }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    label { color: #45516a; }
    input { width: 70px; padding: 8px; border: 1px solid #c8d1df; border-radius: 6px; }
    button { border: 0; border-radius: 7px; padding: 10px 18px; background: #1769e0; color: white; font: inherit; cursor: pointer; }
    button:disabled { background: #9aa8bd; cursor: wait; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f7f9fc; padding: 14px; border-radius: 8px; }
    .status { display: inline-block; padding: 4px 9px; border-radius: 999px; background: #e7f6ec; color: #16733a; }
    .error { color: #b42318; }
    dt { font-weight: 600; margin-top: 10px; }
    dd { margin: 4px 0 0; color: #536078; }
  </style>
</head>
<body>
  <main>
    <h1>Grounded Retrieval Agent</h1>
    <div class="muted">FastAPI 文档检索、引用校验和拒答演示</div>
    <section class="card">
      <div id="health" class="status">检查服务中…</div>
      <textarea id="question">创建资源时如何让 POST 响应状态码为 201？</textarea>
      <div class="row">
        <label>Top K <input id="topK" type="number" min="1" max="5" value="3"></label>
        <label>最大工具轮数 <input id="rounds" type="number" min="1" max="5" value="2"></label>
        <button id="ask">提交问题</button>
      </div>
      <p id="error" class="error"></p>
    </section>
    <section class="card" id="result" hidden>
      <h2>回答</h2>
      <pre id="answer"></pre>
      <dl>
        <dt>工作流状态</dt><dd id="workflow"></dd>
        <dt>引用校验</dt><dd id="citation"></dd>
        <dt>代码块检查</dt><dd id="codeCheck"></dd>
        <dt>证据 ID</dt><dd id="evidence"></dd>
        <dt>延迟 / Token</dt><dd id="cost"></dd>
      </dl>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const health = async () => {
      try {
        const response = await fetch('/healthz');
        const body = await response.json();
        $('health').textContent = response.ok ? `服务正常 · ${body.agent}` : '服务未就绪';
      } catch (_) { $('health').textContent = '无法连接服务'; $('health').className = 'status error'; }
    };
    const ask = async () => {
      $('ask').disabled = true; $('error').textContent = ''; $('result').hidden = true;
      try {
        const response = await fetch('/v1/ask', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
          question: $('question').value, top_k: Number($('topK').value), max_tool_rounds: Number($('rounds').value)
        })});
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
        $('answer').textContent = body.answer || '';
        $('workflow').textContent = `${body.workflow_status} · 拒答=${body.should_refuse}`;
        $('citation').textContent = body.citation_check ? `supported=${body.citation_check.supported}` : '无';
        const check = body.code_block_check || {};
        $('codeCheck').textContent = `检查 ${check.code_blocks_checked ?? 0} 个，移除 ${check.unsupported_code_blocks ?? 0} 个`;
        $('evidence').textContent = (body.retrieved_evidence_ids || []).join(', ') || '无';
        $('cost').textContent = `${body.latency_ms} ms · ${body.usage?.total_tokens ?? '无'} tokens`;
        $('result').hidden = false;
      } catch (error) { $('error').textContent = error.message; }
      finally { $('ask').disabled = false; }
    };
    $('ask').addEventListener('click', ask); health();
  </script>
</body>
</html>
